<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">Three ways a depth sensor measures distance</title>
  <desc id="d">Three panels show how depth cameras measure distance. Stereo: two cameras a baseline B apart see the same point at different image positions; the shift in pixels is the disparity d, and depth z equals f times B divided by d. Structured light: a projector casts a known pattern of infrared dots and one camera, offset from it, sees the dots shift on near and far surfaces. Time-of-flight: the camera emits modulated infrared light and measures the phase delay of the light that returns; distance equals c times phi divided by four pi f. Along the bottom, all three give the same output: a depth image in which each pixel is a distance, which converts into a 3D point cloud using the camera calibration.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker>
  </defs>
  <rect width="640" height="440" rx="16" fill="#0f172a"/>
  <text x="30" y="44" font-size="16" font-weight="700" fill="#e2e8f0">How a depth sensor measures distance</text>
  <text x="610" y="44" font-size="12" fill="#64748b" letter-spacing="1.5" text-anchor="end">3 PRINCIPLES</text>

  <!-- Panel 1: stereo -->
  <rect x="24" y="64" width="190" height="236" rx="10" fill="#111827" stroke="#334155"/>
  <text x="119" y="88" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">1. Stereo</text>
  <text x="119" y="104" font-size="10.5" fill="#64748b" text-anchor="middle">two cameras, triangulate</text>
  <circle cx="119" cy="132" r="6" fill="#f59e0b"/>
  <text x="130" y="128" font-size="10" fill="#fcd34d">point</text>
  <rect x="58" y="226" width="34" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="146" y="226" width="34" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M75 226 L117 138" stroke="#94a3b8" stroke-width="1.3"/>
  <path d="M163 226 L121 138" stroke="#94a3b8" stroke-width="1.3"/>
  <path d="M75 262 L163 262" stroke="#38bdf8" stroke-width="1.3"/>
  <path d="M75 257 L75 267 M163 257 L163 267" stroke="#38bdf8" stroke-width="1.3"/>
  <text x="119" y="276" font-size="10.5" fill="#bae6fd" text-anchor="middle">baseline B</text>
  <text x="119" y="292" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">z = f · B / d</text>

  <!-- Panel 2: structured light -->
  <rect x="225" y="64" width="190" height="236" rx="10" fill="#111827" stroke="#334155"/>
  <text x="320" y="88" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">2. Structured light</text>
  <text x="320" y="104" font-size="10.5" fill="#64748b" text-anchor="middle">known pattern, one camera</text>
  <rect x="250" y="122" width="140" height="44" rx="4" fill="#0b1220" stroke="#475569"/>
  <g fill="#fca5a5">
    <circle cx="262" cy="134" r="2.4"/><circle cx="281" cy="140" r="2.4"/><circle cx="300" cy="131" r="2.4"/><circle cx="318" cy="146" r="2.4"/>
    <circle cx="270" cy="154" r="2.4"/><circle cx="292" cy="158" r="2.4"/><circle cx="336" cy="136" r="2.4"/><circle cx="352" cy="154" r="2.4"/>
    <circle cx="371" cy="139" r="2.4"/><circle cx="380" cy="158" r="2.4"/><circle cx="310" cy="160" r="2.4"/><circle cx="344" cy="162" r="2.4"/>
  </g>
  <text x="320" y="180" font-size="10" fill="#94a3b8" text-anchor="middle">IR dots shift with distance</text>
  <rect x="252" y="226" width="40" height="22" rx="4" fill="#1e293b" stroke="#f87171" stroke-width="1.5"/>
  <text x="272" y="241" font-size="9.5" fill="#fecaca" text-anchor="middle">projector</text>
  <rect x="348" y="226" width="40" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="368" y="241" font-size="9.5" fill="#bae6fd" text-anchor="middle">camera</text>
  <path d="M272 226 L286 192" stroke="#f87171" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M352 194 L366 224" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="320" y="276" font-size="10.5" fill="#94a3b8" text-anchor="middle">e.g. first Kinect, Face ID dots</text>
  <text x="320" y="292" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">triangulate the shift</text>

  <!-- Panel 3: time of flight -->
  <rect x="426" y="64" width="190" height="236" rx="10" fill="#111827" stroke="#334155"/>
  <text x="521" y="88" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">3. Time-of-flight</text>
  <text x="521" y="104" font-size="10.5" fill="#64748b" text-anchor="middle">time the light, every pixel</text>
  <rect x="580" y="120" width="10" height="110" rx="2" fill="#475569"/>
  <text x="575" y="134" font-size="10" fill="#94a3b8" text-anchor="end">surface</text>
  <path d="M470 160 q8 -12 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" fill="none" stroke="#f87171" stroke-width="1.6"/>
  <path d="M572 160 L578 160" stroke="#f87171" stroke-width="1.6" marker-end="url(#b)"/>
  <path d="M572 196 q-8 12 -16 0 t-16 0 t-16 0 t-16 0 t-16 0 t-16 0" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
  <path d="M478 196 L472 196" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="521" y="182" font-size="10" fill="#94a3b8" text-anchor="middle">phase delay φ</text>
  <rect x="446" y="226" width="44" height="22" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="468" y="241" font-size="9.5" fill="#bae6fd" text-anchor="middle">ToF cam</text>
  <path d="M468 226 L468 204" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="521" y="276" font-size="10.5" fill="#94a3b8" text-anchor="middle">e.g. Azure Kinect DK</text>
  <text x="521" y="292" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="middle">d = c · φ / (4π f)</text>

  <!-- arrows to output -->
  <path d="M119 300 L250 330" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M320 300 L320 326" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M521 300 L390 330" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- output -->
  <rect x="150" y="334" width="340" height="82" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="320" y="356" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Same output: a depth image</text>
  <g>
    <rect x="170" y="366" width="14" height="14" fill="#e2e8f0"/><rect x="184" y="366" width="14" height="14" fill="#cbd5e1"/><rect x="198" y="366" width="14" height="14" fill="#64748b"/>
    <rect x="170" y="380" width="14" height="14" fill="#cbd5e1"/><rect x="184" y="380" width="14" height="14" fill="#94a3b8"/><rect x="198" y="380" width="14" height="14" fill="#475569"/>
    <rect x="170" y="394" width="14" height="14" fill="#94a3b8"/><rect x="184" y="394" width="14" height="14" fill="#475569"/><rect x="198" y="394" width="14" height="14" fill="#334155"/>
  </g>
  <text x="222" y="384" font-size="10.5" fill="#94a3b8">pixel = distance (m)</text>
  <path d="M352 387 L382 387" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="367" y="374" font-size="9.5" fill="#64748b" text-anchor="middle">calibration</text>
  <g fill="#38bdf8">
    <circle cx="398" cy="380" r="2"/><circle cx="410" cy="372" r="2"/><circle cx="420" cy="388" r="2"/><circle cx="432" cy="376" r="2"/>
    <circle cx="404" cy="396" r="2"/><circle cx="444" cy="392" r="2"/><circle cx="456" cy="380" r="2"/><circle cx="426" cy="402" r="2"/>
    <circle cx="466" cy="398" r="2"/><circle cx="440" cy="368" r="2"/>
  </g>
  <text x="432" y="412" font-size="10" fill="#bae6fd" text-anchor="middle">point cloud</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">How a costmap scores the floor around an obstacle</title>
  <desc id="d">Left: a top-down grid around a wall. Wall cells are lethal (cost 254). Cells closer to the wall than the robot's inscribed radius are inscribed (253): if the robot's centre were there, it would touch the wall. Beyond that the inflation layer adds a cost that fades with distance, and far away cells are free (0). Right: cost against distance from the nearest obstacle for a robot of radius 0.22 metres and an inflation radius of 0.70 metres, using the Nav2 formula 252 times e to the minus cost_scaling_factor times (distance minus inscribed radius). With a scaling factor of 10 the cost falls to about 34 by 0.42 metres; with 3.0 it is still about 138 there, so the planner keeps the robot further from the wall.</desc>
  <rect width="640" height="400" rx="16" fill="#0f172a"/>
  <text x="30" y="44" font-size="16" font-weight="700" fill="#e2e8f0">How a costmap scores the floor</text>

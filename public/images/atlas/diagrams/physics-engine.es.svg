<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">Un paso de tiempo dentro de un motor de física</title>
  <desc id="d">Un ciclo de cinco etapas que el motor de física de un simulador de robots repite en cada paso de tiempo. 1, el estado en el instante t: posiciones y velocidades. 2, las fuerzas: gravedad, pares de los motores y resortes. 3, detectar colisiones: averiguar qué formas se tocan, primero con una fase amplia rápida y después con una fase estrecha exacta. 4, resolver los contactos: calcular las fuerzas de contacto y de fricción para que los cuerpos no se atraviesen; esta es la parte difícil. 5, integrar: convertir las aceleraciones en nuevas velocidades y después en nuevas posiciones. Luego el tiempo avanza de t a t más delta t y el ciclo vuelve a empezar.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FC6818"/></marker>
  </defs>
  <rect width="640" height="380" rx="16" fill="#0f172a"/>
  <text x="30" y="46" font-size="16" font-weight="700" fill="#e2e8f0">Un paso de tiempo del motor de física</text>
  <text x="610" y="46" font-size="12" fill="#64748b" letter-spacing="1.5" text-anchor="end">SE REPITE CADA Δt</text>

  <!-- top row -->
  <rect x="30" y="90" width="170" height="80" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="115" y="118" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle"><tspan fill="#FC6818">1</tspan>  Estado en t</text>
  <text x="115" y="140" font-size="13" fill="#94a3b8" text-anchor="middle">posiciones y</text>
  <text x="115" y="157" font-size="13" fill="#94a3b8" text-anchor="middle">velocidades</text>

  <rect x="235" y="90" width="170" height="80" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="118" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle"><tspan fill="#FC6818">2</tspan>  Fuerzas</text>
  <text x="320" y="140" font-size="13" fill="#94a3b8" text-anchor="middle">gravedad, pares de</text>
  <text x="320" y="157" font-size="13" fill="#94a3b8" text-anchor="middle">motor, resortes</text>

  <rect x="440" y="90" width="170" height="80" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="525" y="118" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle"><tspan fill="#FC6818">3</tspan>  Detectar colisiones</text>
  <text x="525" y="140" font-size="13" fill="#94a3b8" text-anchor="middle">¿qué formas se tocan?</text>
  <text x="525" y="157" font-size="13" fill="#94a3b8" text-anchor="middle">fase amplia → estrecha</text>

  <!-- bottom row -->
  <rect x="440" y="240" width="170" height="80" rx="10" fill="#1e293b" stroke="#FC6818" stroke-width="2"/>
  <text x="525" y="268" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle"><tspan fill="#FC6818">4</tspan>  Resolver contactos</text>
  <text x="525" y="290" font-size="13" fill="#94a3b8" text-anchor="middle">fuerzas de contacto y</text>
  <text x="525" y="307" font-size="13" fill="#94a3b8" text-anchor="middle">fricción: sin solapes</text>
  <text x="525" y="340" font-size="13" font-weight="700" fill="#FC6818" text-anchor="middle">la parte difícil</text>

  <rect x="235" y="240" width="170" height="80" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="320" y="268" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle"><tspan fill="#FC6818">5</tspan>  Integrar</text>
  <text x="320" y="290" font-size="13" fill="#94a3b8" text-anchor="middle">aceleración → nueva</text>
  <text x="320" y="307" font-size="13" fill="#94a3b8" text-anchor="middle">velocidad → posición</text>

  <!-- arrows -->
  <line x1="202" y1="130" x2="231" y2="130" stroke="#FC6818" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="407" y1="130" x2="436" y2="130" stroke="#FC6818" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="525" y1="172" x2="525" y2="236" stroke="#FC6818" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="438" y1="280" x2="409" y2="280" stroke="#FC6818" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M233 280 H115 V174" fill="none" stroke="#FC6818" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- loop label -->
  <text x="127" y="222" font-size="13" fill="#94a3b8">avanza el tiempo</text>
  <text x="127" y="242" font-size="14" font-weight="700" fill="#FC6818">t → t + Δt</text>
  <text x="320" y="210" font-size="13" fill="#64748b" text-anchor="middle">y se repite</text>

  <text x="30" y="360" font-size="13" fill="#94a3b8">Δt es pequeño: MuJoCo usa 0.002 s por defecto, o sea, 500 pasos por segundo simulado.</text>
</svg>

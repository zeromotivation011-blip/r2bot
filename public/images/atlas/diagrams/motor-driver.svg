<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">How a motor driver sits between a microcontroller and a motor</title>
  <desc id="d">Block diagram. A microcontroller sends two low-current logic signals, PWM for speed and DIR for direction, to a motor driver. The motor driver contains an H-bridge and protection circuits (thermal shutdown, overcurrent and undervoltage lockout). A separate motor power supply feeds the driver's motor-supply pin through a bypass and bulk capacitor, and the driver switches that supply's current through the motor on two output wires. The microcontroller ground, the driver ground and the negative terminal of the motor supply are all joined by one shared ground line, which the logic signals need as their reference.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="640" height="400" rx="16" fill="#0f172a"/>
  <text x="30" y="44" font-size="16" font-weight="700" fill="#e2e8f0">How a motor driver is wired</text>
  <text x="610" y="44" font-size="12" fill="#64748b" letter-spacing="1.5" text-anchor="end">LOGIC IN, POWER OUT</text>
  <rect x="250" y="66" width="160" height="46" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="330" y="86" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Motor power supply</text>
  <text x="330" y="103" font-size="11" fill="#94a3b8" text-anchor="middle">battery or bench supply</text>
  <text x="290" y="126" font-size="12" font-weight="700" fill="#f59e0b" text-anchor="end">+</text>
  <text x="420" y="82" font-size="12" font-weight="700" fill="#94a3b8">−</text>
  <path d="M300 112V150" stroke="#f59e0b" stroke-width="3"/>
  <text x="308" y="134" font-size="11" fill="#fdba74">VM, with bulk capacitor</text>
  <path d="M410 89H612V300" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <rect x="30" y="150" width="160" height="110" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="110" y="176" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Microcontroller</text>
  <text x="110" y="196" font-size="11" fill="#94a3b8" text-anchor="middle">Arduino, ESP32, Pico…</text>
  <text x="110" y="216" font-size="11" fill="#94a3b8" text-anchor="middle">3.3 V or 5 V logic</text>
  <text x="110" y="236" font-size="11" fill="#cbd5e1" text-anchor="middle">pins: milliamps only</text>
  <path d="M190 182H246" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
  <text x="218" y="176" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">PWM</text>
  <path d="M190 226H246" stroke="#38bdf8" stroke-width="2" marker-end="url(#a)"/>
  <text x="218" y="220" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">DIR</text>
  <rect x="250" y="150" width="160" height="110" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="330" y="176" font-size="14" font-weight="700" fill="#e2e8f0" text-anchor="middle">Motor driver</text>
  <text x="330" y="198" font-size="12" fill="#f59e0b" text-anchor="middle">H-bridge</text>
  <text x="330" y="220" font-size="11" fill="#94a3b8" text-anchor="middle">protection: thermal,</text>
  <text x="330" y="236" font-size="11" fill="#94a3b8" text-anchor="middle">overcurrent, undervoltage</text>
  <path d="M410 180H470V188M410 230H470V222" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="440" y="172" font-size="11" fill="#fdba74" text-anchor="middle">OUT1</text>
  <text x="440" y="248" font-size="11" fill="#fdba74" text-anchor="middle">OUT2</text>
  <circle cx="510" cy="205" r="40" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <path d="M470 188H478M470 222H478" stroke="#f59e0b" stroke-width="3"/>
  <text x="510" y="212" font-size="20" font-weight="700" fill="#e2e8f0" text-anchor="middle">M</text>
  <text x="510" y="266" font-size="12" fill="#cbd5e1" text-anchor="middle">Motor: amps</text>
  <path d="M110 260V300M330 260V300M28 300H612" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="110" cy="300" r="4" fill="#94a3b8"/>
  <circle cx="330" cy="300" r="4" fill="#94a3b8"/>
  <circle cx="612" cy="300" r="4" fill="#94a3b8"/>
  <text x="120" y="290" font-size="11" fill="#94a3b8">GND</text>
  <text x="340" y="290" font-size="11" fill="#94a3b8">GND</text>
  <text x="604" y="290" font-size="11" fill="#94a3b8" text-anchor="end">supply −</text>
  <text x="320" y="322" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle" letter-spacing="1">SHARED GROUND: ALL THREE JOINED</text>
  <text x="30" y="358" font-size="11" fill="#64748b">Blue: logic signals, a few milliamps at 3.3 V or 5 V. Amber: motor current, amps, drawn from the</text>
  <text x="30" y="374" font-size="11" fill="#64748b">separate motor supply, never from the microcontroller. Without the shared ground, logic signals have no reference.</text>
</svg>

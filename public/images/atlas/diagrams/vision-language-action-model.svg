<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="t d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <title id="t">How a vision-language-action model controls a robot</title>
  <desc id="d">A camera image goes through a vision encoder and a typed instruction goes through a text tokenizer. Both streams of tokens enter a pretrained vision-language model backbone. The backbone's output becomes robot actions, either as discrete action tokens that map to bins or as a continuous chunk of actions generated by a flow-matching or diffusion action head. The robot executes the commands, a new camera frame is taken, and the loop repeats until the task is done.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#FC6818"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="640" height="380" rx="16" fill="#0f172a"/>
  <text x="30" y="34" font-size="13" fill="#64748b" letter-spacing="1.5">ONE CONTROL STEP · REPEATS UNTIL THE TASK IS DONE</text>

  <!-- camera image -->
  <rect x="30" y="52" width="120" height="84" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="42" y="64" width="96" height="44" rx="4" fill="#0f172a" stroke="#334155"/>
  <rect x="58" y="86" width="16" height="18" rx="3" fill="#94a3b8"/>
  <rect x="96" y="92" width="32" height="12" rx="3" fill="#475569"/>
  <circle cx="122" cy="74" r="5" fill="#FC6818" fill-opacity=".8"/>
  <text x="90" y="127" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">Camera image</text>

  <!-- instruction -->
  <rect x="30" y="152" width="120" height="58" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="90" y="174" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">Instruction</text>
  <text x="90" y="196" font-size="13" fill="#38bdf8" text-anchor="middle">“stack the cups”</text>

  <!-- encoders -->
  <rect x="184" y="64" width="118" height="60" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="243" y="90" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">Vision encoder</text>
  <text x="243" y="109" font-size="13" fill="#94a3b8" text-anchor="middle">image → tokens</text>
  <rect x="184" y="152" width="118" height="58" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="243" y="177" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">Tokenizer</text>
  <text x="243" y="196" font-size="13" fill="#94a3b8" text-anchor="middle">words → tokens</text>
  <line x1="150" y1="94" x2="180" y2="94" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#g)"/>
  <line x1="150" y1="181" x2="180" y2="181" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#g)"/>

  <!-- backbone -->
  <rect x="336" y="52" width="122" height="158" rx="12" fill="#1e293b" stroke="#FC6818" stroke-width="2.5"/>
  <text x="397" y="88" font-size="14" fill="#FC6818" text-anchor="middle" font-weight="700">Language-</text>
  <text x="397" y="106" font-size="14" fill="#FC6818" text-anchor="middle" font-weight="700">model</text>
  <text x="397" y="124" font-size="14" fill="#FC6818" text-anchor="middle" font-weight="700">backbone</text>
  <text x="397" y="154" font-size="13" fill="#94a3b8" text-anchor="middle">pretrained on</text>
  <text x="397" y="171" font-size="13" fill="#94a3b8" text-anchor="middle">web images</text>
  <text x="397" y="188" font-size="13" fill="#94a3b8" text-anchor="middle">and text</text>
  <line x1="302" y1="94" x2="332" y2="108" stroke="#94a3b8" stroke-width="2" marker-end="url(#m)"/>
  <line x1="302" y1="181" x2="332" y2="160" stroke="#94a3b8" stroke-width="2" marker-end="url(#m)"/>

  <!-- action output -->
  <rect x="492" y="52" width="122" height="84" rx="10" fill="#1e293b" stroke="#FC6818" stroke-width="2"/>
  <text x="553" y="78" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">Action output</text>
  <text x="553" y="99" font-size="13" fill="#94a3b8" text-anchor="middle">action tokens</text>
  <text x="553" y="118" font-size="13" fill="#94a3b8" text-anchor="middle">or flow / diffusion</text>
  <line x1="458" y1="94" x2="488" y2="94" stroke="#FC6818" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- robot -->
  <rect x="492" y="152" width="122" height="58" rx="10" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="553" y="176" font-size="13" fill="#e2e8f0" text-anchor="middle" font-weight="700">Robot</text>
  <text x="553" y="196" font-size="13" fill="#94a3b8" text-anchor="middle">motor commands</text>
  <line x1="553" y1="136" x2="553" y2="148" stroke="#FC6818" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- closed loop -->
  <path d="M553 210 V246 H16 V94 H26" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="300" y="238" font-size="13" fill="#38bdf8" text-anchor="middle">robot moves → new camera frame → next step</text>

  <!-- legend: how actions come out -->
  <line x1="30" y1="266" x2="610" y2="266" stroke="#334155"/>
  <text x="30" y="290" font-size="13" fill="#FC6818" font-weight="700">Action tokens</text>
  <text x="150" y="290" font-size="13" fill="#cbd5e1">each action value becomes 1 of 256 bins (RT-2, OpenVLA)</text>
  <text x="30" y="316" font-size="13" fill="#FC6818" font-weight="700">Continuous head</text>
  <text x="150" y="316" font-size="13" fill="#cbd5e1">flow matching or diffusion (π0, GR00T N1, SmolVLA)</text>
  <text x="30" y="342" font-size="13" fill="#FC6818" font-weight="700">Action chunk</text>
  <text x="150" y="342" font-size="13" fill="#cbd5e1">one prediction gives several future commands, so the</text>
  <text x="150" y="360" font-size="13" fill="#cbd5e1">robot can act faster than the model runs</text>
</svg>

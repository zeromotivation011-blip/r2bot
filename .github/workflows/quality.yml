name: Quality

# The cheap half of CLAUDE.md §15, enforced by a machine instead of memory.
# Deliberately does NOT run `next build`: the build needs Supabase, Anthropic
# and Resend keys, which live in Vercel and are not mirrored into GitHub
# secrets. Vercel is the build gate; this is the type and lint gate, and
# live-checks.yml covers what only a deployed site can show.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (strict, no any)
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Every Code Lab mission is solvable by its reference program
        run: npx tsx lib/kids/code-lab/verify.ts
      - name: Kids Robot Passport — word list, forgiving parsing, QR links, server backup check
        run: npx tsx lib/kids/passport.verify.ts
      - name: Story Theatre Piper voices — index intact, every clip present (unvoiced lines only warn)
        run: npx tsx lib/kids/episodes/story-voice.verify.ts
      - name: Every Skill Galaxy activity is valid and its solution passes its template
        run: npx tsx lib/kids/activities/verify.ts
      - name: Kids Robot Maths (every band, worked examples, missions)
        run: npx tsx lib/kids/maths/verify.ts
      - name: Kids inclusion and representation
        run: npx tsx lib/kids/inclusion/verify.ts
      - name: Kids course — every session's arena, activities, game tier and story exist and fit the age; checks carry misconception tags
        run: npx tsx lib/kids/curriculum/verify.ts
      - name: Kids course Levels 3–4 — 48 sessions match the outline, blocks and parts fit, 40-minute plans, misconception-tagged checks, reused challenges exist for the band
        run: npx tsx lib/kids/curriculum/level3/verify.ts
      - name: Hint ladder — every activity and Code Lab mission has a "Spark shows me" twin that never gives its answer away
        run: npx tsx components/kids/galaxy/hint-ladder.verify.ts
      - name: Kids progress backup code round-trips, merges without losing progress, and refuses bad codes; removing a profile erases every profileKey() store
        run: npx tsx lib/kids/progress-backup.verify.ts
      - name: Kids rewards — an unlock at every level, every quest reachable, no XP for replays
        run: npx tsx lib/kids/universe/rewards.verify.ts
      - name: Kids mastery — secure/fading concepts, Recharge missions, Launch Check placement and pacing
        run: npx tsx lib/kids/universe/mastery.verify.ts
      - name: Kids Robodex + Makers — real /robots slugs, every card findable by every band, backup round trip, Makers on every continent, next-step links exist
        run: npx tsx lib/kids/robodex/verify.ts
      - name: Kids Make It at Home — hazard tags, minimum band and adult flag on every build, no coin cells for Explorers, no mains, real Robodex links, fair tests and check questions
        run: npx tsx lib/kids/builds/verify.ts
      - name: Ask Spark safety — red-team set (EN/HI/ES), 100% disclosure + self-harm, 0 false positives
        run: npx tsx lib/kids/ai/spark/redteam/verify.ts
      - name: Kids access — settings store + boot script, and the per-template checklist (names, labels, keyboard, feedback, drag, 44px)
        run: npx tsx lib/kids/access.verify.ts
      - name: Kids robot that grows — upgrade unlocks, learned-part glow, spec sheet trade-offs, X-ray wires on every robot, 20 echo rays for the robot's-eye view
        run: npx tsx lib/kids/robot-growth.verify.ts
      - name: Kids physics sim — demos, Level 1 arenas, determinism, calibration
        run: npx tsx lib/kids/sim/verify.ts
      - name: Kids Flight Recorder + battery — pack maths, drain model, pure-read recording, Power Lab challenges, why-did-it-fail, ghosts
        run: npx tsx lib/kids/sim/flight.verify.ts
      - name: Kids Link Lab + Robot Security Check (#88) — deterministic link sim, every level docks with its protections and breaks without, one right answer per security step, Guardians best ids
        run: npx tsx components/kids/net/net.verify.ts
      - name: Kids unplugged lessons — one per Level 1 session, 40-minute plans, a paper card for every picture block, every floor-grid answer key played square by square
        run: npx tsx lib/kids/unplugged/verify.ts
      - name: Kids Present mode + clubs — a deck for every session, episode and simulator, 5/10/20/5 timer, safe framed paths, QR sizes, club sessions add up
        run: npx tsx lib/kids/teach/clubs.verify.ts
      - name: Kids Classroom wave 2 — snapshot counts only, Mind Map and stuck signals need 2+ children, gradebook evidence, Class Power-Up maths, standards
        run: npx tsx lib/kids/classroom-wave2.verify.ts
      - name: Kids shell — five one-word tabs, one gated grown-up door, Rank naming, next mission, 48px game controls + leave guard, WebGL context-loss poster, toast queue cap
        run: npx tsx components/kids/ui/shell.verify.ts
      - name: Kids game Sky Port (drone-hover) — true debriefs per cause, random tunes rarely win (Legend < 3%, Ace < 15%), 3-star Legend needs I, every tier winnable, Cadet follows more time
        run: npx tsx components/kids/games/drone-hover/drone-hover.verify.ts
      - name: Kids game Circuit City — a drained battery never blames correct wiring, true series/no-path debriefs, random Legend settings win < 3%, answer hints cap at 2 stars, quoted physics true
        run: npx tsx components/kids/games/circuit-city/circuit-city.verify.ts
      - name: Kids game Arm Factory — true grip/weight physics, IK round-trips, random Legend speeds pass < 5% and never 2★, slow-everything misses the 60 s takt, true debrief per cause, helper ghost caps at 2 stars
        run: npx tsx components/kids/games/arm-factory/arm-factory.verify.ts
      - name: Kids game Train the Robot Brain — random Legend designs on uncleaned data pass < 12%, cleaning + augmentation both matter, new parcels every run, true debriefs (Ace delete-only, rotation, headlines), ✨ samples cap at 2 stars
        run: npx tsx components/kids/games/robot-brain/robot-brain.verify.ts
      - name: Kids game Mars Rover Command — Legend par matches the solver, 3★ needs Visual odometry + battery planning (not hidden AEGIS rocks), random Legend plans 3★ < 8% / win < 40%, true dune/battery/off-target debriefs, stuck rover's data still reaches Earth, every Cadet–Ace map has a one-plan route
        run: npx tsx components/kids/games/mars-rover/mars-rover.verify.ts
      - name: Kids game Swarm Reef — random settings win less at every tier up (Legend < 6%, never 3★), Legend runs on after the last beacon, same rules same run, thruster cap true, true debrief per failure cause, faint trails unreadable, answer hints cap at 2 stars
        run: npx tsx components/kids/games/swarm-reef/swarm-reef.verify.ts
      - name: Kids game Maze Mapper — Legend counts wrong map squares (careless brain never 3★), random Legend brain 3★ < 8%, seeded per-reading noise, planner race shows A*/greedy differences, Ace one-button only ties, true debrief per failure cause, Cadet hint caps at 2 stars, every tier winnable
        run: npx tsx components/kids/games/maze-mapper/maze-mapper.verify.ts

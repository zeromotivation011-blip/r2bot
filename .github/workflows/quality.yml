name: Quality

# The cheap half of CLAUDE.md §15, enforced by a machine instead of memory.
# Deliberately does NOT run `next build`: the build needs Supabase, Anthropic
# and Resend keys, which live in Vercel and are not mirrored into GitHub
# secrets. Vercel is the build gate; this is the type and lint gate, and
# live-checks.yml covers what only a deployed site can show.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  types-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check (strict, no any)
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Every Code Lab mission is solvable by its reference program
        run: npx tsx lib/kids/code-lab/verify.ts
      - name: Every Skill Galaxy activity is valid and its solution passes its template
        run: npx tsx lib/kids/activities/verify.ts
      - name: Kids course — every session's arena, activities, game tier and story exist and fit the age; checks carry misconception tags
        run: npx tsx lib/kids/curriculum/verify.ts
      - name: Kids course Levels 3–4 — 48 sessions match the outline, blocks and parts fit, 40-minute plans, misconception-tagged checks, reused challenges exist for the band
        run: npx tsx lib/kids/curriculum/level3/verify.ts
      - name: Hint ladder — every activity and Code Lab mission has a "Spark shows me" twin that never gives its answer away
        run: npx tsx components/kids/galaxy/hint-ladder.verify.ts
      - name: Kids progress backup code round-trips, merges without losing progress, and refuses bad codes
        run: npx tsx lib/kids/progress-backup.verify.ts
      - name: Kids rewards — an unlock at every level, every quest reachable, no XP for replays
        run: npx tsx lib/kids/universe/rewards.verify.ts
      - name: Kids mastery — secure/fading concepts, Recharge missions, Launch Check placement and pacing
        run: npx tsx lib/kids/universe/mastery.verify.ts
      - name: Kids Robodex + Makers — real /robots slugs, every card findable by every band, backup round trip, Makers on every continent, next-step links exist
        run: npx tsx lib/kids/robodex/verify.ts
      - name: Ask Spark safety — red-team set (EN/HI/ES), 100% disclosure + self-harm, 0 false positives
        run: npx tsx lib/kids/ai/spark/redteam/verify.ts
      - name: Kids access — settings store + boot script, and the per-template checklist (names, labels, keyboard, feedback, drag, 44px)
        run: npx tsx lib/kids/access.verify.ts
      - name: Kids robot that grows — upgrade unlocks, learned-part glow, spec sheet trade-offs, X-ray wires on every robot, 20 echo rays for the robot's-eye view
        run: npx tsx lib/kids/robot-growth.verify.ts
      - name: Kids physics sim — demos, Level 1 arenas, determinism, calibration
        run: npx tsx lib/kids/sim/verify.ts
      - name: Kids Flight Recorder + battery — pack maths, drain model, pure-read recording, Power Lab challenges, why-did-it-fail, ghosts
        run: npx tsx lib/kids/sim/flight.verify.ts

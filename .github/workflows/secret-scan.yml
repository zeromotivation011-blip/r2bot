name: Secret scan

# A GitHub token was pasted into a chat on 6 Nov 2026 and this repository is
# public, with a Supabase project behind it holding real learner progress,
# certificates and the email list. A scanner that only runs after the fact is
# doing a third of the job: this runs on every push and PR, and gitleaks also
# belongs in a local pre-commit hook (see CONTRIBUTING notes in the PR).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so an old committed secret is found too
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

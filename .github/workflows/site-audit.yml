name: Site-wide quality audit

# Lighthouse across every page template — performance, ACCESSIBILITY, SEO and
# best-practices — using Unlighthouse (github.com/harlan-zw/unlighthouse, MIT).
#
# This exists because every other check in this repo measures whether a page
# exists, not whether it is any good. On 8 Nov 2026 all 512 Atlas pages served a
# blank page for hours while the sitemap check, the link crawl, the homepage
# Lighthouse budget and the build all stayed green.
#
# Division of labour with the existing checks:
#   quality.yml      — type-check + lint on every PR (fast gate)
#   lighthouse       — ONE page (homepage) with a hard budget, per PR
#   live-checks.yml  — daily: sitemap honesty, dead links, Atlas has content
#   this workflow    — weekly: full Lighthouse suite across all templates
#
# Weekly, not per-PR: a site-wide scan takes minutes, and per-PR performance
# regressions are already caught by the homepage budget.
on:
  schedule:
    - cron: '23 4 * * 1' # Monday 09:53 IST, after the weekend content crons
  workflow_dispatch:
    inputs:
      site:
        description: 'Origin to audit'
        default: 'https://www.r2bot.in'
        required: false
      budget:
        description: 'Minimum score to require (leave empty to report only)'
        default: ''
        required: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the auditor
        # CI-only, global, pinned. Never a dependency in package.json — nothing
        # about this reaches the browser bundle.
        run: npm install -g @unlighthouse/cli@0.19.1

      - name: Audit one page per template
        # EXPLICIT URL LIST, NOT A CRAWL — and that is the whole lesson of the
        # first real run (8 Nov 2026). Left to crawl, Unlighthouse discovered
        # 1,756 routes and requested them fast enough to trip the site's own rate
        # limiting, which answered 403. It skipped /shorts, every /robots/* page,
        # /ros2 and most of the Atlas, finished with 34 alphabetically-early
        # pages, and reported healthy averages. The numbers were real but the
        # sample was an accident of which pages replied before the limiter woke.
        #
        # One verified page per template is better evidence than an accidental
        # slice of a thousand: it is deterministic, it is genuinely
        # representative, it finishes in a couple of minutes, and it cannot be
        # throttled into looking fine. Every URL below was confirmed 200.
        #
        # Adding a new page TEMPLATE? Add one of its URLs here and bump --min.
        # --mobile: the audience is phone-first; desktop numbers would flatter us.
        run: |
          BUDGET_FLAG=""
          if [ -n "${{ inputs.budget }}" ]; then
            BUDGET_FLAG="--budget ${{ inputs.budget }}"
          fi
          unlighthouse-ci \
            --site "${{ inputs.site || 'https://www.r2bot.in' }}" \
            --mobile \
            --samples 1 \
            --build-static \
            --reporter jsonExpanded \
            --urls "/,/atlas,/atlas/concept/slam,/atlas/robot/shakey,/atlas/person/rodney-brooks,/atlas/company/boston-dynamics,/shorts,/shorts/line-follower,/courses,/academy,/academy/spark,/academy/spark/01,/robots,/robots/nao,/news,/blog,/blog/ai-and-robotics-complete-guide,/build,/visualizer,/ai-robotics,/daily-life,/about,/pricing" \
            $BUDGET_FLAG

      - name: Summarise, and assert the scan actually covered the site
        if: always()
        # --min is what stops a throttled or half-finished scan from passing as
        # evidence. 23 URLs requested, 23 demanded. Keep these in step.
        run: node scripts/summarise-audit.mjs --min 23

      - name: Keep the full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: .unlighthouse/
          retention-days: 30
          # `.unlighthouse/` is a DOT-directory, and upload-artifact@v4 skips
          # hidden files by default. Both earlier runs warned "No files were
          # found", uploaded nothing, and reported the step as successful — so
          # the report this workflow promises to keep has never once existed.
          # Third time in two days that a green step produced nothing (see
          # CLAUDE.md §16); make the next one loud instead.
          include-hidden-files: true
          if-no-files-found: error

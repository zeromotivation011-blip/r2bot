name: Live checks

# Everything here failed in production at least once and was found weeks later
# by a human reading carefully:
#   - the sitemap served a July view of the site for months, missing ~300 URLs
#   - pages inherited the homepage canonical
#   - Atlas links 404'd after slugs changed
#   - first-load JS crept up until a phone on 3G bounced
#   - all 512 Atlas pages served an empty husk for hours: 200 OK, in the
#     sitemap, links fine, and not a word of content on any of them
# Runs daily, and on demand after a deploy.
on:
  schedule:
    - cron: '37 6 * * *' # 12:07 IST, after the daily content cron
  workflow_dispatch:
    inputs:
      base:
        description: 'Origin to check'
        default: 'https://www.r2bot.in'
        required: false

permissions:
  contents: read

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assert the sitemap is real and honest
        run: node scripts/check-sitemap.mjs "${{ inputs.base || 'https://www.r2bot.in' }}"

  atlas-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every other check here measures whether a page EXISTS. This one measures
      # whether it says anything — the gap that let the Atlas go blank.
      - name: Assert Atlas pages render their content
        run: node scripts/check-atlas-content.mjs "${{ inputs.base || 'https://www.r2bot.in' }}"

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # lychee has no --sitemap flag: it extracts links from the inputs it is
      # given. So pull the <loc> list out of the sitemap into a plain text
      # file and hand it that.
      - name: Collect sitemap URLs
        run: |
          curl -sS "${{ inputs.base || 'https://www.r2bot.in' }}/sitemap.xml" \
            | grep -o '<loc>[^<]*</loc>' \
            | sed -e 's|<loc>||' -e 's|</loc>||' \
            > sitemap-urls.txt
          echo "$(wc -l < sitemap-urls.txt) URLs to check"
          test -s sitemap-urls.txt
      - name: Crawl them for dead links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --max-concurrency 6
            --timeout 25
            --max-retries 2
            --accept 200,206,999
            sitemap-urls.txt
          fail: true

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core pages against a performance budget
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ inputs.base || 'https://www.r2bot.in' }}/
            ${{ inputs.base || 'https://www.r2bot.in' }}/shorts
            ${{ inputs.base || 'https://www.r2bot.in' }}/atlas/concept/slam
            ${{ inputs.base || 'https://www.r2bot.in' }}/courses
            ${{ inputs.base || 'https://www.r2bot.in' }}/news
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
